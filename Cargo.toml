[package]
name = "iced-desktop-shell"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["iced-desktop-shell contributors"]
description = "An experimental technical desktop application shell boilerplate in Rust using Iced"
readme = "README.md"
keywords = ["iced", "desktop", "shell", "gui", "boilerplate"]
categories = ["gui"]

[dependencies]
desktop-shell = { path = "crates/desktop-shell", version = "0.1.0" }
iced = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
members = [".", "crates/desktop-shell"]
